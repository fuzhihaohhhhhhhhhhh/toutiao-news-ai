# ════════════════════════════════════════════════════════════════
# 前端站点的 nginx 配置（生产）
#
# 它同时承担两件事：
#   1. 托管 Vue 编译后的静态文件
#   2. 把 /api 反向代理到后端容器
#
# 因为前端代码里用的是**相对路径** `/api/...`（见 src/config/api.js），
# 所以前端完全不需要知道后端在哪个 IP、哪个端口 —— 由这里接管。
# 好处：换域名、换端口、上 HTTPS 都不用改前端代码，且同源无跨域。
# ════════════════════════════════════════════════════════════════

# 后端容器在同一个 compose 网络里，直接用服务名访问
upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 访问日志与错误日志走标准输出/错误，方便 docker compose logs 查看
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ── 压缩（前端资源体积能省一半以上）──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── 带内容哈希的静态资源：可以放心长缓存 ──
    # Vite 产出的文件名形如 index-a1b2c3d4.js，内容变则文件名变
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 反向代理：接口 + 接口文档 ──
    # 只想对外开接口、不想暴露 Swagger 文档的话，
    # 把下面的 |docs|redoc|openapi\.json 去掉即可。
    location ~ ^/(api|docs|redoc|openapi\.json) {
        proxy_pass http://backend_api;

        proxy_http_version 1.1;

        # ↓ 这三行是 **SSE 流式回答** 的关键。
        #   后端 /api/chat/stream 是逐 token 推送的；nginx 默认会把响应
        #   缓冲起来，等攒够一批才发给浏览器 —— 那样"逐字出现"的效果就没了。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成回答可能较慢（尤其带检索时），放宽超时，
        # 否则 nginx 会在 60 秒时把连接掐掉
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 前端路由（history 模式）──
    # 路由用的是 createWebHistory，直接访问 /aichat 这类路径时
    # 服务器上并没有对应文件，必须回退到 index.html 交给前端路由处理，
    # 否则刷新页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
