# ════════════════════════════════════════════════════════════════════════
# 生产部署叠加文件（部署到服务器时用）
#
#   【本机开发】照旧，不要用这个文件：
#       docker compose up -d
#
#   【服务器部署】把两个文件叠起来用：
#       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 它做两件事：
#   1. 增加 `nginx` 容器 —— 托管前端编译后的静态文件，并把 /api 反代给后端
#   2. 只对外暴露一个端口（默认 80，由 nginx 提供）
#
# 这样前端与接口**同源**，不存在跨域问题；前端代码里也不需要写服务器的 IP。
#
# ── 可选：在服务器上建一个 .env 覆盖默认值 ─────────────────────────────
#     WEB_PORT=80                # 想用别的端口就改这里
#     BACKEND_BIND=127.0.0.1     # 强烈建议：让 8000 只监听本机，
#                                # 公网访问不到（调试时用 ssh 隧道即可）
#                                # 不设则默认 0.0.0.0，8000 会对外可达
#     BACKEND_PORT=8000
# ════════════════════════════════════════════════════════════════════════

services:
  # ─────────────── 前端站点 + 反向代理（生产入口）───────────────
  nginx:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        # 前端构建时的 npm 源。国际网络用默认值即可；
        # 国内建议在仓库根目录的 .env 里加一行：
        #     NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        # 等后端健康检查通过再起 nginx，避免启动瞬间出现 502
        condition: service_healthy
